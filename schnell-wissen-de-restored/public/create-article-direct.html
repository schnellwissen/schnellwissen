        <div class="form-group">

    <h3>4x9 mit Ausgleich</h3>

        </div>
        
        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status">
                <option value="draft">Entwurf</option>
                <option value="published" selected>Veröffentlicht</option>
            </select>
        </div>
        
        <button type="submit" id="submitBtn">Artikel erstellen</button>
    </form>

    <script>
        function showStatus(message, type = 'loading') {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.innerHTML = message;
        }

        document.getElementById('articleForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Erstelle Artikel...';
            
            showStatus('Artikel wird erstellt...', 'loading');
            
            // Collect form data
            const formData = new FormData(this);
            const articleData = {
                title: formData.get('title'),
                slug: formData.get('slug'),
                meta_description: formData.get('meta_description'),
                category_id: formData.get('category_id'),
                image_url: formData.get('image_url'),
                content: formData.get('content'),
                status: formData.get('status'),
                reading_time: Math.max(1, Math.ceil(formData.get('content').replace(/<[^>]*>/g, '').split(/\s+/).length / 200))
            };
            
            try {
                const response = await fetch('/api/test-article-creation', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(articleData)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                
                if (result.success) {
                    showStatus(`✅ Artikel erfolgreich erstellt! ID: ${result.id}, Slug: ${result.slug}`, 'success');
                    
                    // Open the created article
                    setTimeout(() => {
                        window.open(`/artikel/${result.slug}`, '_blank');
                    }, 1000);
                } else {
                    showStatus(`❌ Fehler beim Erstellen: ${result.error}`, 'error');
                }
            } catch (error) {
                showStatus(`❌ Netzwerkfehler: ${error.message}`, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Artikel erstellen';
            }
        });
    </script>
</body>
</html>
