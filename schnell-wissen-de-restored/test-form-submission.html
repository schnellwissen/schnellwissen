<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Form Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .loading { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { padding: 10px 20px; margin: 10px 5px; cursor: pointer; }
        .btn-primary { background: #007bff; color: white; border: none; }
        .btn-success { background: #28a745; color: white; border: none; }
        pre { background: #f8f9fa; padding: 10px; border: 1px solid #dee2e6; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Article Creation Test</h1>
    <p>This page will test creating an article via the web interface to check for Jest worker errors.</p>
    
    <div id="status"></div>
    
    <button id="testBtn" class="btn-primary" onclick="testArticleCreation()">Test Article Creation</button>
    <button id="openFormBtn" class="btn-success" onclick="openArticleForm()">Open Article Form</button>
    
    <div id="results"></div>

    <script>
        function showStatus(message, type = 'loading') {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.innerHTML = message;
        }

        function showResults(data) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `<h3>Results:</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
        }

        async function testArticleCreation() {
            showStatus('Testing article creation...', 'loading');
            
            const articleData = {
                title: "Warum 4-Tage-Woche nicht gleich weniger Arbeit bedeutet",
                slug: "warum-4-tage-woche-nicht-gleich-weniger-arbeit-bedeutet-test",
                content: \`<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Warum 4-Tage-Woche nicht gleich weniger Arbeit bedeutet</title>
</head>
<body>
<article>
  <header>
    <h1>Warum 4-Tage-Woche nicht gleich weniger Arbeit bedeutet</h1>
    <p>Vier Tage, gleiche Wirkung. Die 4 Tage Woche kann Leistung halten oder steigern, wenn Planung, Fokuszeiten und klare Ziele greifen.</p>
  </header>
  <section>
    <h2>Warum weniger Tage nicht weniger Arbeit sind</h2>
    <p>Leistung entsteht durch Fokus. Nicht durch Sitzzeit. Die 4 Tage Woche bündelt Arbeit in klare Blöcke.</p>
  </section>
</article>
</body>
</html>\`,
                meta_description: "4-Tage-Woche: Mehr Fokus, gleiche Leistung. Entdecke Modelle, Produktivitätskennzahlen, rechtliche Rahmenbedingungen und Tipps für die erfolgreiche Umsetzung.",
                category_id: "4",
                image_url: "/uploads/1754393386477-7dd1iovs79s.png",
                status: "published",
                reading_time: 10
            };

            try {
                const response = await fetch('http://localhost:3000/api/test-article-creation', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(articleData)
                });

                if (!response.ok) {
                    throw new Error(\`HTTP error! status: \${response.status}\`);
                }

                const result = await response.json();
                
                if (result.success) {
                    showStatus(\`✅ Article created successfully! ID: \${result.id}\`, 'success');
                    showResults(result);
                    
                    // Try to open the created article
                    setTimeout(() => {
                        window.open(\`http://localhost:3000/artikel/\${result.slug}\`, '_blank');
                    }, 1000);
                } else {
                    showStatus(\`❌ Failed to create article: \${result.error}\`, 'error');
                    showResults(result);
                }
            } catch (error) {
                showStatus(\`❌ Error: \${error.message}\`, 'error');
                showResults({ error: error.message });
            }
        }

        function openArticleForm() {
            window.open('http://localhost:3000/dashboard-xy934k2_admin/artikel/neu', '_blank');
        }

        // Auto-test on page load
        window.addEventListener('load', () => {
            setTimeout(() => {
                showStatus('Ready to test. Click "Test Article Creation" to start.', 'success');
            }, 1000);
        });
    </script>
</body>
</html>
